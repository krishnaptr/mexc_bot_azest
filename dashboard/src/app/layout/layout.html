<div
  class="flex h-screen bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans transition-colors duration-300"
>
  <aside
    class="w-72 bg-white dark:bg-slate-900 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] dark:shadow-none border-r border-transparent dark:border-slate-800 z-10 transition-colors duration-300"
  >
    <div class="p-8">
      <div class="flex items-center gap-3">
        <div
          class="bg-indigo-600 p-2 rounded-xl shadow-indigo-200 dark:shadow-none shadow-lg"
        >
          <i class="pi pi-chart-line text-white text-xl"></i>
        </div>
        <span
          class="text-xl font-bold tracking-tight text-slate-800 dark:text-white"
          >Azest Bot</span
        >
      </div>
    </div>

    <nav class="flex-1 px-4 flex flex-col gap-1">
      <a
        routerLink="/"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-4 px-4 py-3 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-slate-600 dark:hover:text-slate-300 rounded-xl font-medium transition-all cursor-pointer"
      >
        <i class="pi pi-th-large"></i> Dashboard
      </a>

      <a
        routerLink="/history"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-4 px-4 py-3 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-slate-600 dark:hover:text-slate-300 rounded-xl font-medium transition-all cursor-pointer"
      >
        <i class="pi pi-history"></i> History
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400 font-semibold"
        class="flex items-center gap-4 px-4 py-3 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:text-slate-600 dark:hover:text-slate-300 rounded-xl font-medium transition-all cursor-pointer"
      >
        <i class="pi pi-cog"></i> Settings
      </a>
    </nav>

    <div
      class="p-4 border-t border-slate-100 dark:border-slate-800 transition-colors duration-300"
    >
      @if (botService.isServerOnline()) {
        <div
          class="flex items-center gap-2 text-xs font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 p-2 rounded-lg justify-center transition-colors duration-300"
        >
          <i class="pi pi-wifi animate-pulse"></i> API Terhubung
        </div>
      } @else {
        <div
          class="flex items-center gap-2 text-xs font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 p-2 rounded-lg justify-center transition-colors duration-300"
        >
          <i class="pi pi-wifi text-rose-500"></i> API Terputus
        </div>
      }
    </div>
  </aside>

  <main
    class="flex-1 overflow-y-auto bg-slate-50/50 dark:bg-slate-950 transition-colors duration-300"
  >
    <header
      class="h-20 flex items-center justify-between px-8 bg-transparent mt-2"
    >
      <span
        class="text-sm font-medium text-slate-400 dark:text-slate-500 uppercase tracking-widest hidden sm:block"
        >Market Overview</span
      >

      <div class="flex items-center gap-4 sm:gap-6">
        <div
          class="flex items-center gap-2 px-3 py-1.5 rounded-lg border font-semibold text-sm transition-colors duration-300"
          [ngClass]="
            botService.isBotActive()
              ? 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/20'
              : 'bg-rose-50 dark:bg-rose-500/10 text-rose-700 dark:text-rose-400 border-rose-200 dark:border-rose-500/20'
          "
        >
          <span class="relative flex h-3 w-3">
            @if (botService.isBotActive()) {
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
              ></span>
            }
            <span
              class="relative inline-flex rounded-full h-3 w-3"
              [ngClass]="
                botService.isBotActive() ? 'bg-emerald-500' : 'bg-rose-500'
              "
            ></span>
          </span>
          {{ botService.isBotActive() ? "BOT AKTIF" : "BOT JEDA" }}
        </div>

        <p-button
          [label]="botService.isBotActive() ? 'Jeda' : 'Mulai'"
          [icon]="botService.isBotActive() ? 'pi pi-pause' : 'pi pi-play'"
          [severity]="botService.isBotActive() ? 'warn' : 'success'"
          [outlined]="!botService.isBotActive()"
          size="small"
          (onClick)="botService.toggleBot()"
        >
        </p-button>

        <div
          class="w-px h-8 bg-slate-200 dark:bg-slate-700 transition-colors duration-300"
        ></div>

        <button
          (click)="botService.toggleDarkMode()"
          class="p-2 w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors"
        >
          <i
            class="pi text-xl text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all"
            [ngClass]="botService.isDarkMode() ? 'pi-sun' : 'pi-moon'"
          >
          </i>
        </button>

        <i
          class="pi pi-bell text-xl text-slate-400 cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-all"
        ></i>
      </div>
    </header>

    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
<p-toast position="top-right" />
